# Конфигурация для Amvera Cloud.
# Переменные GEMINI_API_KEY, GOOGLE_SCRIPT_URL, YOOKASSA_SHOP_ID, YOOKASSA_SECRET_KEY
# задаются в разделе «Переменные» в интерфейсе Amvera, а не здесь.
meta:
  environment: python
  toolchain:
    name: pip
    version: 3.12
build:
  requirementsPath: requirements.txt
run:
  persistenceMount: /data          # постоянный диск: готовые PDF и JPG переживут перезапуск
  containerPort: 80
  command: uvicorn main_cake:app --host 0.0.0.0 --port 80
